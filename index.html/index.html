<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-Commerce Admin Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }

    #wrapper {
      min-height: 100vh;
    }

    #sidebar-wrapper {
      min-width: 220px;
      background-color: #343a40;
    }

    #sidebar-wrapper .nav-link {
      color: #ddd;
    }

    #sidebar-wrapper .nav-link:hover {
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      color: #fff;
    }

    .card h6 {
      font-weight: 600;
    }

    .card small {
      font-size: 0.8rem;
    }

    .progress {
      height: 5px;
    }
  </style>
</head>
<body>
  <div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="text-white p-3" id="sidebar-wrapper">
      <h4 class="text-center mb-4">Shop Admin</h4>
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="#">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Customers</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Reports</a></li>
      </ul>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper" class="w-100">
      <!-- Navbar -->
      <nav class="navbar navbar-light bg-white border-bottom px-4 shadow-sm">
        <span class="navbar-brand mb-0 h1">E-Commerce Dashboard</span>
        <form class="d-flex">
          <input class="form-control me-2" type="search" placeholder="Search..." />
          <button class="btn btn-outline-secondary" type="submit">Search</button>
        </form>
      </nav>

      <!-- Main Content -->
      <div class="container-fluid mt-4">
        <div class="row g-3">
          <!-- Card 1 -->
          <div class="col-md-3">
            <div class="card text-white bg-primary shadow-sm">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <h6 class="card-title mb-1">Total Sales</h6>
                    <h3>$24,580</h3>
                    <small class="text-white-50">+12% this week</small>
                  </div>
                  <div><i class="bi bi-currency-dollar fs-2"></i></div>
                </div>
                <div class="progress mt-3">
                  <div class="progress-bar bg-light" style="width: 75%"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Card 2 -->
          <div class="col-md-3">
            <div class="card text-white bg-success shadow-sm">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <h6 class="card-title mb-1">New Orders</h6>
                    <h3>134</h3>
                    <small class="text-white-50">+20 from yesterday</small>
                  </div>
                  <div><i class="bi bi-cart-fill fs-2"></i></div>
                </div>
                <div class="progress mt-3">
                  <div class="progress-bar bg-light" style="width: 60%"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Card 3 -->
          <div class="col-md-3">
            <div class="card text-white bg-warning shadow-sm">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <h6 class="card-title mb-1">Out of Stock</h6>
                    <h3>8</h3>
                    <small class="text-white-50">Restock needed</small>
                  </div>
                  <div><i class="bi bi-box-seam fs-2"></i></div>
                </div>
                <div class="progress mt-3">
                  <div class="progress-bar bg-light" style="width: 40%"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Card 4 -->
          <div class="col-md-3">
            <div class="card text-white bg-danger shadow-sm">
              <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                  <div>
                    <h6 class="card-title mb-1">Customer Issues</h6>
                    <h3>5</h3>
                    <small class="text-white-50">Pending replies</small>
                  </div>
                  <div><i class="bi bi-exclamation-diamond-fill fs-2"></i></div>
                </div>
                <div class="progress mt-3">
                  <div class="progress-bar bg-light" style="width: 30%"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Chart Section -->
        <div class="mt-5">
          <h4>Sales by Category</h4>
          <div class="bg-white p-4 border rounded shadow-sm">
            <canvas id="salesChart" height="100"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Chart Script -->
  <script>
    const ctx = document.getElementById('salesChart').getContext('2d');
    const salesChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Electronics', 'Clothing', 'Home', 'Beauty', 'Books'],
        datasets: [{
          label: 'Sales (in $1000)',
          data: [8.5, 12.3, 7.8, 5.6, 3.9],
          backgroundColor: [
            '#0d6efd',
            '#198754',
            '#ffc107',
            '#d63384',
            '#6c757d'
          ],
          borderColor: '#fff',
          borderWidth: 1
        }]
      },
      options: {
        responsive: false,
        scales: {
          y: {
            beginAtZero: true
          }
        },
        plugins: {
          legend: {
            display: true,
            position: 'top'
          }
        }
      }
    });
  </script>
</body>
</html>
